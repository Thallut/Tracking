<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tracker - ThingSpeak</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    html, body { min-height: 100%; margin: 0; background: #f5f6f8; }
    #map { height: min(72vh, 680px); min-height: 400px; border-radius: 10px; }
    .table-container { max-height: 310px; overflow-y: auto; }
    .navbar-brand { font-weight: 600; }
    .info-label { color: #6c757d; }
    .status-dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; margin-right: 7px; background: #adb5bd;
    }
    .status-online { background: #198754; }
    .status-error { background: #dc3545; }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">GPS TRACKING SYSTEM</span>
      <span class="navbar-text text-light small">ESP32 · GPS · ThingSpeak</span>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div class="row g-3">
      <section class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Live Map</h5>
              <span class="small text-secondary">
                <span id="statusDot" class="status-dot"></span>
                <span id="connectionStatus">Connecting...</span>
              </span>
            </div>
            <div id="map"></div>
          </div>
        </div>
      </section>

      <aside class="col-lg-4">
        <div class="card shadow-sm mb-3">
          <div class="card-header bg-white"><strong>Last Data Received</strong></div>
          <div class="card-body">
            <div class="row mb-2">
              <div class="col-5 info-label">Date (WIB)</div>
              <div class="col-7" id="timeDate">-</div>
            </div>
            <div class="row mb-2">
              <div class="col-5 info-label">Time (WIB)</div>
              <div class="col-7" id="timeTime">-</div>
            </div>
            <div class="row mb-2">
              <div class="col-5 info-label">Latitude</div>
              <div class="col-7" id="latitude">-</div>
            </div>
            <div class="row mb-2">
              <div class="col-5 info-label">Longitude</div>
              <div class="col-7" id="longitude">-</div>
            </div>
            <div class="row mb-3">
              <div class="col-5 info-label">Distance</div>
              <div class="col-7"><strong id="distance">0.000 km</strong></div>
            </div>

            <div class="d-flex gap-2">
              <button id="startButton" class="btn btn-success flex-fill">
                Start Tracking
              </button>
              <button id="resetButton" class="btn btn-outline-primary" disabled>
                Reset
              </button>
            </div>
            <p class="text-secondary small mt-3 mb-0" id="lastUpdate">
              Waiting for ThingSpeak data...
            </p>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <strong>History</strong>
            <span class="text-secondary small">(maks. 100 titik)</span>
          </div>
          <div class="card-body table-container">
            <table class="table table-striped table-sm align-middle" id="historyTable">
              <thead class="table-dark sticky-top">
                <tr>
                  <th>#</th><th>Waktu</th><th>Latitude</th><th>Longitude</th><th>Km</th>
                </tr>
              </thead>
              <tbody id="historyBody">
                <tr><td colspan="5" class="text-center text-secondary">Belum ada riwayat.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // Channel yang digunakan oleh ESP32.
    const CHANNEL_ID = "3592503";

    // Jika channel ThingSpeak disetel PUBLIC, biarkan string kosong.
    // Jika channel PRIVATE, masukkan Read API Key di sini.
    // Jangan gunakan Write API Key pada halaman HTML.
    const READ_API_KEY = "";

    const POLL_INTERVAL_MS = 15000;
    const MAX_HISTORY = 100;
    const MAX_VALID_JUMP_METERS = 100;

    const latestFeedUrl = () => {
      const keyParameter = READ_API_KEY
        ? `&api_key=${encodeURIComponent(READ_API_KEY)}`
        : "";
      return `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?${keyParameter}`;
    };

    const map = L.map("map").setView([-6.2, 106.8], 5);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const currentMarker = L.marker([-6.2, 106.8]).addTo(map);
    const routeLine = L.polyline([], { color: "#0d6efd", weight: 4 }).addTo(map);

    let tracking = false;
    let hasCenteredMap = false;
    let lastEntryId = null;
    let previousPoint = null;
    let totalDistanceKm = 0;
    let history = [];

    const $ = (id) => document.getElementById(id);

    function setConnectionStatus(message, state) {
      $("connectionStatus").textContent = message;
      $("statusDot").className = "status-dot";
      if (state === "online") $("statusDot").classList.add("status-online");
      if (state === "error") $("statusDot").classList.add("status-error");
    }

    function haversineMeters(a, b) {
      const earthRadius = 6371000;
      const toRad = (degrees) => degrees * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const value =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) *
        Math.sin(dLng / 2) ** 2;

      return 2 * earthRadius * Math.atan2(
        Math.sqrt(value),
        Math.sqrt(1 - value)
      );
    }

    function formatWIB(isoTimestamp) {
      const date = new Date(isoTimestamp);
      if (Number.isNaN(date.getTime())) {
        return { date: "-", time: "-" };
      }

      return {
        date: new Intl.DateTimeFormat("id-ID", {
          timeZone: "Asia/Jakarta",
          day: "2-digit", month: "2-digit", year: "numeric"
        }).format(date),
        time: new Intl.DateTimeFormat("id-ID", {
          timeZone: "Asia/Jakarta",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        }).format(date)
      };
    }

    function renderHistory() {
      const body = $("historyBody");
      body.innerHTML = "";

      if (history.length === 0) {
        body.innerHTML =
          '<tr><td colspan="5" class="text-center text-secondary">Belum ada riwayat.</td></tr>';
        return;
      }

      history.slice().reverse().forEach((item, index) => {
        const row = document.createElement("tr");
        const values = [
          String(history.length - index),
          item.time,
          item.lat.toFixed(6),
          item.lng.toFixed(6),
          item.distance.toFixed(3)
        ];

        values.forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });
        body.appendChild(row);
      });
    }

    function processFeed(feed) {
      const lat = Number(feed.field1);
      const lng = Number(feed.field2);

      if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
          lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        throw new Error("Latitude/longitude pada Field 1/2 tidak valid.");
      }

      const point = { lat, lng };
      const time = formatWIB(feed.created_at);

      $("latitude").textContent = lat.toFixed(6);
      $("longitude").textContent = lng.toFixed(6);
      $("timeDate").textContent = time.date;
      $("timeTime").textContent = time.time;
      $("lastUpdate").textContent =
        `Entry ID: ${feed.entry_id} · Waktu data: ${time.date} ${time.time} WIB`;

      currentMarker.setLatLng([lat, lng])
        .bindPopup(
          `<strong>Latest Position</strong><br>Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}`
        );

      if (!hasCenteredMap) {
        map.setView([lat, lng], 16);
        hasCenteredMap = true;
      }

      // Polling dapat membaca feed yang sama berulang kali.
      // Entry ID mencegah titik/jarak tercatat berkali-kali.
      if (String(feed.entry_id) === String(lastEntryId)) return;
      lastEntryId = feed.entry_id;

      if (tracking) {
        if (previousPoint === null) {
          previousPoint = point;
          routeLine.setLatLngs([[lat, lng]]);
          totalDistanceKm = 0;
        } else {
          const distanceMeters = haversineMeters(previousPoint, point);

          // Abaikan lonjakan GPS yang tidak wajar.
          if (distanceMeters <= MAX_VALID_JUMP_METERS) {
            totalDistanceKm += distanceMeters / 1000;
            previousPoint = point;
            routeLine.addLatLng([lat, lng]);
          } else {
            // Titik tetap menjadi referensi baru agar tracking dapat pulih.
            previousPoint = point;
          }
        }

        $("distance").textContent = `${totalDistanceKm.toFixed(3)} km`;
        history.push({
          time: `${time.date} ${time.time}`,
          lat,
          lng,
          distance: totalDistanceKm
        });

        if (history.length > MAX_HISTORY) history.shift();
        renderHistory();
      }
    }

    async function fetchLatestData() {
      try {
        const response = await fetch(latestFeedUrl(), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: gagal membaca ThingSpeak.`);
        }

        const data = await response.json();
        if (!data || !data.field1 || !data.field2 || !data.created_at) {
          throw new Error("Feed kosong. Periksa Field 1 dan Field 2 di ThingSpeak.");
        }

        processFeed(data);
        setConnectionStatus("ThingSpeak connected", "online");
      } catch (error) {
        console.error("[ThingSpeak]", error);
        setConnectionStatus("Connection error", "error");
        $("lastUpdate").textContent = error.message;
      }
    }

    $("startButton").addEventListener("click", () => {
      tracking = !tracking;

      if (tracking) {
        previousPoint = null;
        totalDistanceKm = 0;
        history = [];
        routeLine.setLatLngs([]);
        $("distance").textContent = "0.000 km";
        renderHistory();

        $("startButton").textContent = "Stop Tracking";
        $("startButton").classList.replace("btn-success", "btn-danger");
        $("resetButton").disabled = true;
      } else {
        $("startButton").textContent = "Start Tracking";
        $("startButton").classList.replace("btn-danger", "btn-success");
        $("resetButton").disabled = false;
      }
    });

    $("resetButton").addEventListener("click", () => {
      tracking = false;
      previousPoint = null;
      totalDistanceKm = 0;
      history = [];
      routeLine.setLatLngs([]);

      $("distance").textContent = "0.000 km";
      $("startButton").textContent = "Start Tracking";
      $("startButton").classList.remove("btn-danger");
      $("startButton").classList.add("btn-success");
      $("resetButton").disabled = true;

      renderHistory();
    });

    fetchLatestData();
    setInterval(fetchLatestData, POLL_INTERVAL_MS);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS Tracker - ThingSpeak</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f9; }
    #map { height: min(68vh, 620px); min-height: 380px; border-radius: 10px; }
    .card { border:0; box-shadow:0 2px 12px rgba(0,0,0,.06); }
    .history-wrap { max-height:300px; overflow:auto; }
    .value { font-weight:600; overflow-wrap:anywhere; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid"><span class="navbar-brand mb-0">GPS TRACKING - THINGSPEAK</span></div>
</nav>

<main class="container-fluid py-3">
  <div class="row g-3">
    <section class="col-lg-8"><div class="card p-2"><div id="map"></div></div></section>
    <aside class="col-lg-4">
      <div class="card mb-3">
        <div class="card-header fw-semibold">Last Data Received</div>
        <div class="card-body">
          <div class="d-flex justify-content-between mb-2"><span>Status</span><span id="status" class="badge text-bg-secondary">Connecting...</span></div>
          <div class="row g-2">
            <div class="col-5">Date / Time</div><div class="col-7 value" id="datetime">-</div>
            <div class="col-5">Latitude</div><div class="col-7 value" id="latitude">-</div>
            <div class="col-5">Longitude</div><div class="col-7 value" id="longitude">-</div>
            <div class="col-5">Distance</div><div class="col-7 value"><span id="distance">0.000</span> km</div>
            <div class="col-5">Entry ID</div><div class="col-7 value" id="entry">-</div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button id="startBtn" class="btn btn-success flex-fill">Start Tracking</button>
            <button id="resetBtn" class="btn btn-outline-primary" disabled>Reset</button>
          </div>
          <small class="text-muted d-block mt-2">Dashboard mengecek data setiap 5 detik. Data posisi baru mengikuti interval upload ESP32 ke ThingSpeak.</small>
        </div>
      </div>
      <div class="card">
        <div class="card-header fw-semibold">History (maks. 100 titik)</div>
        <div class="history-wrap">
          <table class="table table-sm table-striped mb-0" id="historyTable">
            <thead class="table-dark sticky-top"><tr><th>#</th><th>Waktu</th><th>Latitude</th><th>Longitude</th><th>Km</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </aside>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Channel ThingSpeak. Channel harus Public jika READ_API_KEY dikosongkan.
  const CHANNEL_ID = 3592503;
  const READ_API_KEY = "CYHKQ1CH47ZF41QN"; // Isi Read API Key hanya jika channel Private.
  const POLL_INTERVAL_MS = 5000;
  const MAX_HISTORY = 100;

  const feedUrl = () => `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json${READ_API_KEY ? `?api_key=${encodeURIComponent(READ_API_KEY)}` : ""}`;
  const map = L.map('map').setView([-2.5, 118], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const marker = L.marker([-2.5, 118]).addTo(map);
  const route = L.polyline([], { color: 'blue', weight: 4 }).addTo(map);
  let tracking = false;
  let lastEntryId = null;
  let previousPoint = null;
  let totalDistanceKm = 0;
  let history = [];

  const el = id => document.getElementById(id);
  function setStatus(message, type) {
    el('status').textContent = message;
    el('status').className = `badge text-bg-${type}`;
  }

  function haversine(a, b) {
    const R = 6371000;
    const rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat);
    const dLng = rad(b.lng - a.lng);
    const q = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(q), Math.sqrt(1-q));
  }

  function renderHistory() {
    const tbody = el('historyTable').querySelector('tbody');
    tbody.innerHTML = '';
    [...history].reverse().forEach((p, i) => {
      const tr = document.createElement('tr');
      [history.length - i, p.time, p.lat.toFixed(6), p.lng.toFixed(6), p.distance.toFixed(3)].forEach(v => {
        const td = document.createElement('td');
        td.textContent = v;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function processFeed(data) {
    if (!data || data.field1 === null || data.field2 === null || !data.created_at || data.entry_id == null) {
      throw new Error('Feed kosong atau Field 1/2 belum terisi.');
    }
    // Endpoint last.json terus mengembalikan titik terakhir. Jangan proses titik yang sama berulang.
    if (String(data.entry_id) === String(lastEntryId)) return;

    const lat = Number(data.field1);
    const lng = Number(data.field2);
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
      throw new Error('Koordinat tidak valid.');
    }

    const point = { lat, lng };
    const time = new Date(data.created_at);
    const timeText = Number.isNaN(time.getTime()) ? data.created_at : time.toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });

    el('latitude').textContent = lat.toFixed(6);
    el('longitude').textContent = lng.toFixed(6);
    el('datetime').textContent = timeText;
    el('entry').textContent = data.entry_id;
    marker.setLatLng([lat, lng]).bindPopup(`Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}`);
    map.panTo([lat, lng]);

    if (tracking) {
      if (previousPoint) {
        const delta = haversine(previousPoint, point);
        // Filter lonjakan GPS ekstrem agar jarak tidak melonjak tidak wajar.
        if (delta <= 100) totalDistanceKm += delta / 1000;
      }
      previousPoint = point;
      route.addLatLng([lat, lng]);
      history.push({ time: timeText, lat, lng, distance: totalDistanceKm });
      if (history.length > MAX_HISTORY) history.shift();
      el('distance').textContent = totalDistanceKm.toFixed(3);
      renderHistory();
    }

    lastEntryId = data.entry_id;
  }

  async function fetchLatestData() {
    try {
      const response = await fetch(feedUrl(), { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      processFeed(data);
      setStatus('Connected', 'success');
    } catch (error) {
      console.error(error);
      setStatus('Connection error', 'danger');
    }
  }

  el('startBtn').addEventListener('click', () => {
    tracking = !tracking;
    if (tracking) {
      previousPoint = null;
      totalDistanceKm = 0;
      history = [];
      route.setLatLngs([]);
      el('distance').textContent = '0.000';
      renderHistory();
      el('startBtn').textContent = 'Stop Tracking';
      el('startBtn').classList.replace('btn-success', 'btn-danger');
      el('resetBtn').disabled = true;
    } else {
      el('startBtn').textContent = 'Start Tracking';
      el('startBtn').classList.replace('btn-danger', 'btn-success');
      el('resetBtn').disabled = false;
    }
  });

  el('resetBtn').addEventListener('click', () => {
    tracking = false;
    previousPoint = null;
    totalDistanceKm = 0;
    history = [];
    route.setLatLngs([]);
    el('distance').textContent = '0.000';
    renderHistory();
    el('startBtn').textContent = 'Start Tracking';
    el('startBtn').classList.remove('btn-danger');
    el('startBtn').classList.add('btn-success');
    el('resetBtn').disabled = true;
  });

  fetchLatestData();
  setInterval(fetchLatestData, POLL_INTERVAL_MS);
</script>
</body>
</html>
